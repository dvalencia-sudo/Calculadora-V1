<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main>
        <section>
            <div class="pantalla">
                <input type="text" id="display">
            </div>
        </section>
        <section id="container-btn">
            <div>
                <input type="button" id="btn1" class="btn btn-num" value="1" onclick="valor('1')">
                <input type="button" id="btn2" class="btn btn-num" value="2" onclick="valor('2')">
                <input type="button" id="btn3" class="btn btn-num" value="3" onclick="valor('3')">
                <input type="button" id="btnPlus" class="btn btn-ope" value="+" onclick="valor('+')">
            </div>
            <div class="btn">
                <input type="button" id="btn4" class="btn btn-num" value="4" onclick="valor('4')">
                <input type="button" id="btn5" class="btn btn-num" value="5" onclick="valor('5')">
                <input type="button" id="btn6" class="btn btn-num" value="6" onclick="valor('6')">
                <input type="button" id="btnMinus" class="btn btn-ope" value="-" onclick="valor('-')">
            </div>
            <div>
                <input type="button" id="btn7" class="btn btn-num" value="7" onclick="valor('7')">
                <input type="button" id="btn8" class="btn btn-num" value="8" onclick="valor('8')">
                <input type="button" id="btn9" class="btn btn-num" value="9" onclick="valor('9')">
                <input type="button" id="btnMult" class="btn btn-ope" value="*" onclick="valor('*')">
            </div>
            <div>
                <input type="button" id="btn0" class="btn btn-num" value="0" onclick="valor('0')">
                <input type="button" id="btnDot" class="btn btn-ope" value="." onclick="valor('.')">
                <input type="button" id="btn%" class="btn btn-ope" value="%" onclick="valor('%')">
                <input type="button" id="btnDiv" class="btn btn-ope" value="/" onclick="valor('/')">
            </div>
            <div>
                <input type="button" id="btnEquals" class="btn btn-ope" value="=" onclick="calcular()">
                <input type="button" id="btnClear" class="btn btn-ope" value="C" onclick="borrar()">
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
